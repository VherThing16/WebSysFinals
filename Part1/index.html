<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsabili - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: url('https://i.ibb.co/hDKY9vv/market-bg.jpg') no-repeat center center/cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background-color: rgba(0, 0, 0, 0.6);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      width: 90%;
      max-width: 350px;
    }

    .login-container img {
      width: 60px;
      margin-bottom: 15px;
    }

    .login-container h1 {
      color: #fff;
      margin-bottom: 20px;
      font-size: 22px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    .login-btn {
      width: 100%;
      background-color: #fff;
      color: #000;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }

    .login-btn:hover {
      background-color: #ddd;
    }

    .error {
      color: #ff8080;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <img src="https://i.ibb.co/F75STtR/market-icon.png" alt="logo" />
    <h1>RESPONSABILI</h1>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit" class="login-btn">Login</button>
      <div class="error" id="error-msg"></div>
    </form>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (email === "dulatre@gmail.com" && password === "bayag") {
        window.location.href = "profile.html";
      } else {
        document.getElementById("error-msg").innerText = "Invalid credentials!";
      }
    });
  </script>
</body>
</html>
